<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="popup.css?v=1.0.5">
    <script type="module" src="popup.js?v=1.0.5"></script>
  </head>
  <body>

    <div id="svg-icons" hidden>
      <svg id="icon-user" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-icon lucide-user"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <svg id="icon-password" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-key-round-icon lucide-key-round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg>
      <svg id="icon-edit" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-pen-icon lucide-square-pen"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>
      <svg id="icon-show" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-search-corner-icon lucide-file-search-corner"><path d="M11.1 22H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.706.706l3.589 3.588A2.4 2.4 0 0 1 20 8v3.25"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="m21 22-2.88-2.88"/><circle cx="16" cy="17" r="3"/></svg>
      <svg id="icon-link" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-external-link-icon lucide-external-link"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
      <svg id="icon-copy" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy-icon lucide-copy"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
    </div>

    <main class="popup">

      <div id="main-panel" class="panel">
        <div class="panel-header">
          <div class="icon-text">
            <div class="icon header-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-key-round-icon lucide-key-round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg>
            </div>
            <div class="icon-text-text">
              <div class="header-title">pass</div>
            </div>
          </div>
          <div class="header-buttons">
            <button id="sync-button" class="icon" title="Sync with git">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-refresh-cw-icon lucide-refresh-cw"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
            </button>
            <button id="new-entry" type="button" class="compact-button primary" title="New Entry">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus-icon lucide-plus"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            </button>
          </div>
        </div>

        <div class="panel-content">
          <div class="main-panel-content">
            <div class="search-area">
              <label class="field-label" for="search">Search</label>
              <input id="search" type="search" placeholder="Type to filter entries" autocomplete="off" spellcheck="false">
            </div>

            <div id="suggestions-area" class="suggestions-area" hidden>
              <div class="entries-header">
                <div class="entries-header-title">Suggestions</div>
                <div id="suggestions-counter" class="entries-header-counter">0</div>
              </div>
              <div id="suggestions" class="entries"></div>
            </div>

            <div id="entries-area" class="entries-area">
              <div class="entries-header">
                <div id="entries-header-title" class="entries-header-title">Entries</div>
                <div id="entries-counter" class="entries-header-counter">0</div>
              </div>
              <div id="entries" class="entries"></div>
            </div>
          </div>
        </div>

        <div id="mail-panel-footer" class="panel-footer">
          <div id="status" class="status" role="status">Loading entries…</div>
        </div>
      </div>


      <div id="edit-panel" class="panel" hidden>
        <div class="panel-header">
          <div class="icon-text">
            <div class="icon header-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-pen-icon lucide-square-pen"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>
            </div>
            <div class="icon-text-text">
              <input id="edit-title-input" type="text" value="" placeholder="New Entry">
            </div>
          </div>
        </div>

        <div class="panel-content">
          <div class="edit-panel-content">

            <div class="edit-row">
              <div class="field-label">Password</div>
              <div class="edit-value">
                <input type="password" id="edit-password-input">
                <button id="edit-toggle-password" type="button" class="icon detail-inline-action" aria-label="Show password" title="Show password"
                  data-show_icon='<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-icon lucide-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>'
                  data-hide_icon='<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-off-icon lucide-eye-off"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>'
                >
                  <button id="edit-copy-password" class="icon" title="Copy password">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy-icon lucide-copy"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                </button>
              </div>
            </div>

            <div class="edit-row">
              <div class="field-label">Username</div>
              <div class="edit-value">
                <input type="text" id="edit-username-input">
                <button id="edit-copy-username" class="icon" title="Copy username">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy-icon lucide-copy"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                </button>
              </div>
            </div>

            <div class="edit-row">
              <div class="field-label">URL</div>
              <div class="edit-value">
                <input type="text" id="edit-url-input">
                <button id="edit-open-url" class="icon" title="Open URL">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-external-link-icon lucide-external-link"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
                </button>
                <button id="edit-copy-url" class="icon" title="Copy URL">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy-icon lucide-copy"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                </button>
              </div>
            </div>

            <div class="edit-body">
              <label class="field-label" for="edit-content">Additional Fields</label>
              <div class="hint">
                <div>Use the format <pre>"key: value"</pre></div>
              </div>
              <textarea id="edit-content" class="edit-textarea" rows="12" spellcheck="false"></textarea>
            </div>

            <div id="password-generator" class="password-generator">
              <div class="password-options-row">
                <div class="password-options-col1">
                  <input type="number" id="password-length" class="password-length"  min="8" max="128" value="24">
                  <div>Password Length</div>
                </div>
                
                <div class="password-options-col2">
                  <div class="password-generator-options">
                    <label class="option" title="Uppercase letters">
                      <input type="checkbox" id="password-check-upper" checked>
                      A–Z
                    </label>
                    <label class="option" title="Lowercase letters">
                      <input type="checkbox" id="password-check-lower" checked>
                      a–z
                    </label>
                    <label class="option" title="Numbers">
                      <input type="checkbox" id="password-check-numbers" checked>
                      0–9
                    </label>
                    <label class="option" title="Special characters">
                      <input type="checkbox" id="password-check-special" title="Numbers" checked>
                      !@#$
                    </label>
                  </div>
                </div>
              </div>

              <div class="password-options-row">
                <div class="password-options-col1">
                  <div>
                    <input id="password-min-digits" type="number" min="1" max="36" value="3">
                    <div>Minimum number of digits</div>
                  </div>
                </div>

                <div class="password-options-col2">
                  <div>
                    <input id="password-min-special-chars" type="number" min="1" max="36" value="3">
                    <div>Minimum number of special characters</div>
                  </div>
                </div>
              </div>

              <div class="password-options-row">
                <div class="password-options-col1">
                  <div>
                    <label>
                      <input type="checkbox" id="password-avoid-ambigous">
                      Avoid ambigous characters
                    </label>
                  </div>
                </div>
                <div class="password-options-col2">
                  <div class="password-generator-button-area">
                    <button id="password-generate-button" class="compact-button secondary">
                      Generate
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="panel-footer">
          <div class="panel-actions">
            <button id="delete-edit" type="button" class="compact-button danger">Delete</button>
          </div>
          <div class="panel-status">
            <div id="edit-status" class="status" role="status"></div>
          </div>
          <div class="panel-actions">
            <button id="cancel-edit" type="button" class="compact-button secondary">Cancel</button>
            <button id="save-edit" type="button" class="compact-button primary">Save</button>
          </div>
        </div>
      </div>


      <div id="detail-panel" class="panel" hidden>
        <div class="panel-header">
          <div class="icon-text">
            <div class="icon header-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-pen-icon lucide-square-pen"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>
            </div>
            <div class="icon-text-text">
              <div id="details-title" class="header-title">Edit details</div>
            </div>
          </div>
        </div>

        <div class="panel-content">
          <div class="detail-panel-content">


            <div class="detail-content">

              <div id="detail-password-row" class="detail-row" hidden>
                <div class="detail-label">Password</div>
                <div class="detail-body">
                  <div id="detail-password" class="detail-value"></div>
                  <div class="detail-action">
                    <button id="toggle-password" type="button" class="icon" aria-label="Show password" title="Show password"
                      data-show_icon='<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-icon lucide-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>'
                      data-hide_icon='<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-off-icon lucide-eye-off"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>'
                    >
                    </button>
                    <button id="copy-password" type="button" class="icon detail-inline-action" title="Copy password">
                      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy-icon lucide-copy"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                    </button>
                  </div>
                </div>
              </div>

              <div id="detail-username-row" class="detail-row" hidden>
                <div class="detail-label">Username</div>
                <div class="detail-body">
                  <div id="detail-username" class="detail-value"></div>
                  <div class="detail-action">
                    <button id="copy-username" type="button" class="icon" title="Copy username">
                      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy-icon lucide-copy"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                    </button>
                  </div>
                </div>
              </div>

              <div id="detail-otp-row" class="detail-row" hidden>
                <div id="detail-otp-label" class="detail-label">One-time code</div>
                <div class="detail-body">
                  <div id="detail-otp" class="detail-value"></div>
                  <div class="detail-action">
                    <button id="copy-otp" type="button" class="icon" title="Copy OTP">
                      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy-icon lucide-copy"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                    </button>
                  </div>
                </div>
              </div>

              <div id="detail-url-row" class="detail-row" hidden>
                <div class="detail-label">URL</div>
                <div class="detail-body">
                  <div id="detail-url" class="detail-value"></div>
                  <div class="detail-action">
                    <button id="open-url" type="button" class="icon" title="Open URL">
                      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-external-link-icon lucide-external-link"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
                    </button>
                    <button id="detail-copy-url" class="icon" title="Copy URL">
                      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy-icon lucide-copy"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                    </button>
                  </div>
                </div>
              </div>

              <div id="detail-additional-fields" class="detail-additional-fields" hidden>
              </div>

              <div id="detail-notes-row" class="detail-stack" hidden>
                <div class="detail-label">Notes</div>
                <pre id="detail-notes" class="detail-value detail-notes"></pre>
              </div>

            </div>
          </div>
        </div>

        <div class="panel-footer">
          <div class="panel-status">
            <div id="details-status" class="status" role="status"></div>
          </div>
          <div class="panel-actions">
            <button id="close-details" type="button" class="compact-button secondary">Close</button>
            <button id="autofill-entry" type="button" class="compact-button primary" title="Shortcut: Enter" aria-keyshortcuts="Enter">
              Autofill
            </button>
            <button id="edit-entry" type="button" class="icon" title="Edit entry">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-pen-icon lucide-square-pen"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>
            </button>
          </div>
        </div>
      </div>


    </main>
  </body>
</html>
