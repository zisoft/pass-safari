<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Simple key icon for Safari toolbar (monochrome) -->
  <g fill="currentColor">
    <!-- Key head (circle) -->
    <circle cx="12" cy="4.5" r="3.2"/>
    <circle cx="12" cy="4.5" r="1.6" fill="none" stroke="currentColor" stroke-width="0.8"/>
    
    <!-- Key shaft -->
    <rect x="2" y="7.5" width="8" height="1.5" rx="0.3"/>
    
    <!-- Connection -->
    <path d="M 10 8 L 10 5.8 Q 10 4.8 11 4.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Key teeth -->
    <rect x="2" y="7.5" width="1" height="2.5"/>
    <rect x="4" y="7.5" width="1" height="3.2"/>
    <rect x="6" y="7.5" width="1" height="2.5"/>
  </g>
</svg>
