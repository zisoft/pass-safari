<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- SF Symbol key.horizontal style for toolbar -->
  <g fill="currentColor">
    <!-- Key head (circle with hole) -->
    <circle cx="4" cy="8" r="3"/>
    <circle cx="4" cy="8" r="1.5" fill="none" stroke="currentColor" stroke-width="0.8"/>
    
    <!-- Key shaft -->
    <rect x="4" y="7" width="9.5" height="2" rx="0.3"/>
    
    <!-- Key teeth -->
    <rect x="12" y="7" width="0.8" height="3"/>
    <rect x="13" y="7" width="0.8" height="2"/>
  </g>
</svg>
